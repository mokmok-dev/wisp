name: ci
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  # `nix flake check` runs treefmt, `swift build`, and `swift test`. The Swift
  # gates use the host toolchain, so this has to stay on a macOS runner with
  # Xcode installed; that is also what makes the `tests` attribute execute
  # rather than skip.
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - run: nix flake check
