name: formal
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-formal
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify lifecycle implementation with Kani
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: "0.67.0"
          command: cargo-kani
          args: "-p wisp-lifecycle"
      - uses: ./.github/actions/setup-nix
      - name: Explore lifecycle interleavings with Shuttle
        run: nix develop .#default --quiet --command cargo test -p wisp-lifecycle --test shuttle_lifecycle
