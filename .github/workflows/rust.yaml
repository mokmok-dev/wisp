name: rust
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - ".rustfmt.toml"
      - ".github/workflows/rust.yaml"
      - "flake.lock"
      - "flake.nix"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-rust
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-rust-cache
      - run: nix develop .#ci --quiet --command cargo fmt --all -- --check
      # Linux lacks the X11 libraries GPUI links against. Desktop coverage
      # lives in the platform-specific macOS and Windows workflows.
      - run: nix develop .#ci --quiet --command cargo clippy --workspace --exclude wisp-desktop --all-targets -- -D warnings
      - run: nix develop .#ci --quiet --command cargo test --workspace --exclude wisp-desktop --all-targets
