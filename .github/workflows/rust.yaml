name: rust
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - ".rustfmt.toml"
      - ".github/workflows/rust.yaml"
      - "flake.lock"
      - "flake.nix"
      - "apps/wisp-desktop/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-rust
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          # Avoid another Nix-based workflow winning the shared primary key
          # before this job can persist Crane's buildDepsOnly artifacts.
          cache-suffix: crane
      # Building through `nix develop` (not `nix flake check`) so clippy
      # inherits the host Xcode toolchain; gpui compiles Metal shaders with
      # Xcode's `metal`, which is unreachable from inside a pure sandbox.
      # Tests are covered in rust-macos.yaml.
      - run: nix develop .#default --quiet --command cargo clippy --workspace --all-targets --all-features -- --deny warnings
