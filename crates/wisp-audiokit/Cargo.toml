[package]
name = "wisp-audiokit"
edition.workspace = true
version.workspace = true
publish = false
description = "Safe Rust wrapper over the WispAudioKit Swift framework."

[features]
default = []
# The model lifecycle provider and live transcription runtime share the
# process-global Foundry Local manager.
foundry = [
  "wisp-models/foundry",
  "dep:foundry-local-sdk",
  "dep:futures-core",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tokio-util",
]

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"

[lints.rust]
# Safe wrapper around the -sys crate; the unsafe blocks are localised and
# documented per-call.
unsafe_code = "allow"

[dependencies]
wisp-audiokit-sys = { path = "../wisp-audiokit-sys" }
wisp-core = { path = "../wisp-core" }
wisp-models = { path = "../wisp-models" }
crossbeam-channel = { workspace = true }
ogg = "0.9.2"
ropus = "0.12.18"
thiserror = { workspace = true }
sha2 = "0.10.9"
tempfile = { workspace = true }
foundry-local-sdk = { version = "=1.2.3", optional = true }
futures-core = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-util = { version = "0.7", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = "1.13.4"

[target.'cfg(target_os = "windows")'.dependencies]
# The upstream static Windows archive is built with /MT, while Rust's default
# MSVC runtime uses /MD. Use the DLL build to avoid conflicting C runtimes.
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }
wasapi = "0.23.0"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Globalization",
  "Media_SpeechRecognition",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Performance",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "=0.9.2"
