[package]
name = "wisp-audiokit"
edition.workspace = true
version.workspace = true
publish = false
description = "Safe Rust wrapper over the WispAudioKit Swift framework."

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"

[lints.rust]
# Safe wrapper around the -sys crate; the unsafe blocks are localised and
# documented per-call.
unsafe_code = "allow"

[dependencies]
wisp-audiokit-sys = { path = "../wisp-audiokit-sys" }
wisp-core = { path = "../wisp-core" }
crossbeam-channel = { workspace = true }
ogg = "0.9.2"
ropus = "0.12.18"
sherpa-onnx = "1.13.4"
thiserror = { workspace = true }
sha2 = "0.10.9"
tempfile = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
# whisper-rs enables no accelerator by default. Build whisper.cpp's Metal
# backend explicitly so Apple Silicon does not run CPU-only inference.
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23.0"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Globalization",
  "Media_SpeechRecognition",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Performance",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "=0.9.2"
